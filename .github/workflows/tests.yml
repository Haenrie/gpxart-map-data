# Tests des Builders (cargo test) bei jedem Push und Pull Request.

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - run: cargo test --locked
