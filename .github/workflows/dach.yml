# Baut den Wegegraphen für ganz DACH aus dem Geofabrik-Auszug und veröffentlicht ihn als Release.
#
#   Vierteljährlich   am 1. Januar, April, Juli und Oktober um 02:17 UTC
#   Von Hand    „Run workflow“
#
# Ein Release enthält wegegraph.tar.gz (aktuell.json, LIZENZ.txt und <Version>/12/<x>/<y>.bin, also genau den Ordner
# graph/ eines Servers), wegegraph.json (Version, Quelle, Messwerte) und SHA256SUMS. Die Version ist das Datum der
# OSM-Daten plus der Commit des Builders, z. B. 2026-10-18-1a2b3c4; gibt es sie schon, baut der Lauf nichts.
# gpxart.com holt das Release ab und liefert es aus; dieses Repo braucht dafür keine Geheimnisse.
#
# Der Lauf prüft die Grenzen der Auslieferung (Cloudflare Workers Static Assets: höchstens 20.000 Dateien, je Datei
# 25 MiB; GitHub: je Release-Datei 2 GiB) und bricht ab, wenn eine überschritten ist.

name: DACH bauen

on:
  schedule:
    - cron: '17 2 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: write # Release anlegen

concurrency:
  group: dach
  cancel-in-progress: false

env:
  GEOFABRIK: https://download.geofabrik.de/europe/dach-latest.osm.pbf
  BEHALTEN: 3 # so viele Releases bleiben, ältere werden gelöscht

jobs:
  bauen:
    name: Wegegraph für DACH
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # dach-latest.osm.pbf leitet auf die Datei mit Datum um, z. B. dach-261018.osm.pbf
          datei=$(curl -fsSI "$GEOFABRIK" | tr -d '\r' | awk 'tolower($1) == "location:" { print $2 }' | xargs basename)
          [[ $datei =~ ^dach-([0-9]{2})([0-9]{2})([0-9]{2})\.osm\.pbf$ ]] || { echo "::error::unerwartet: $datei"; exit 1; }
          datum="20${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]}"
          version="$datum-${GITHUB_SHA::7}"
          echo "Quelle $datei, Version $version"
          {
            echo "datei=$datei"
            echo "datum=$datum"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "Release $version gibt es schon, nichts zu tun." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "neu=false" >> "$GITHUB_OUTPUT"
          else
            echo "neu=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rechner
        if: steps.version.outputs.neu == 'true'
        run: |
          nproc
          free -h
          df -h .

      - name: Rust
        if: steps.version.outputs.neu == 'true'
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: actions/cache@v6
        if: steps.version.outputs.neu == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-dach-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Tests und Builder
        if: steps.version.outputs.neu == 'true'
        run: |
          cargo test --locked
          cargo build --release --locked

      - name: OSM-Daten laden
        if: steps.version.outputs.neu == 'true'
        env:
          DATEI: ${{ steps.version.outputs.datei }}
        run: |
          pruefsumme=$(curl -fsS "$GEOFABRIK.md5" | cut -d' ' -f1)
          curl -fsSL --retry 3 -o dach.osm.pbf "$(dirname "$GEOFABRIK")/$DATEI"
          echo "$pruefsumme  dach.osm.pbf" | md5sum -c - \
            || { echo "::error::Prüfsumme falsch (hat Geofabrik inzwischen aktualisiert? Dann neu starten)"; exit 1; }
          ls -l dach.osm.pbf

      - name: Kacheln bauen
        if: steps.version.outputs.neu == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [ -x /usr/bin/time ] || sudo apt-get install -y -qq time
          /usr/bin/time -v -o zeit.txt target/release/wegegraph "graph/$VERSION" dach.osm.pbf | tee bau.log | grep -v '^Zeilen'
          rm dach.osm.pbf
          grep -E 'Maximum resident|Elapsed' zeit.txt
          df -h .

      - name: Grenzen prüfen und packen
        if: steps.version.outputs.neu == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DATEI: ${{ steps.version.outputs.datei }}
          DATUM: ${{ steps.version.outputs.datum }}
        run: |
          kacheln=$(find "graph/$VERSION" -name '*.bin' | wc -l)
          read -r groesste groesste_kachel < <(find "graph/$VERSION" -name '*.bin' -printf '%s %P\n' | sort -n | tail -1)
          summe=$(find "graph/$VERSION" -name '*.bin' -printf '%s\n' | awk '{ s += $1 } END { print s }')
          speicher_kb=$(awk -F': ' '/Maximum resident/ { print $2 }' zeit.txt)
          dauer=$(awk -F': ' '/Elapsed/ { print $2 }' zeit.txt)

          echo "{\"version\":\"$VERSION\"}" > graph/aktuell.json
          cat > graph/LIZENZ.txt <<EOF
          Wegegraph für gpxart.com, Version $VERSION

          Daten © OpenStreetMap-Mitwirkende, verfügbar unter der Open Database License (ODbL) 1.0,
          https://opendatacommons.org/licenses/odbl/1-0/ und https://www.openstreetmap.org/copyright.
          Dieser Wegegraph ist eine aus OpenStreetMap abgeleitete Datenbank und steht ebenfalls unter der ODbL 1.0.
          Contains information from OpenStreetMap, which is made available here under the Open Database License (ODbL).

          Quelle: Geofabrik-Auszug $DATEI (OSM-Daten vom $DATUM).
          Gebaut mit https://github.com/$GITHUB_REPOSITORY (Commit $GITHUB_SHA),
          Format: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/wegegraph-format.md
          EOF
          tar -C graph -czf wegegraph.tar.gz aktuell.json LIZENZ.txt "$VERSION"
          archiv=$(stat -c %s wegegraph.tar.gz)

          jq -n --arg version "$VERSION" --arg quelle "$DATEI" --arg datum "$DATUM" --arg commit "$GITHUB_SHA" \
            --argjson kacheln "$kacheln" --argjson bytes "$summe" --argjson archiv "$archiv" \
            --arg groesste_kachel "$groesste_kachel" --argjson groesste "$groesste" \
            --argjson speicher_kb "$speicher_kb" --arg dauer "$dauer" \
            '{version: $version, format: 2, quelle: $quelle, osm_datum: $datum, commit: $commit,
              kacheln: $kacheln, bytes: $bytes, archiv_bytes: $archiv,
              groesste_kachel: {pfad: $groesste_kachel, bytes: $groesste},
              bau: {speicher_hoechstens_kb: $speicher_kb, dauer: $dauer}}' > wegegraph.json
          sha256sum wegegraph.tar.gz wegegraph.json > SHA256SUMS
          cat wegegraph.json

          # Grenzen: Graph-Worker mit Kacheln, aktuell.json, LIZENZ.txt und 404.html; je Datei 25 MiB; Release-Datei 2 GiB
          fehler=0
          [ $((kacheln + 3)) -le 20000 ] || { echo "::error::$kacheln Kacheln: zu viele Dateien für einen Worker"; fehler=1; }
          [ "$groesste" -le $((25 * 1024 * 1024)) ] || { echo "::error::$groesste_kachel ist größer als 25 MiB"; fehler=1; }
          [ "$archiv" -le $((2 * 1024 * 1024 * 1024)) ] || { echo "::error::Archiv größer als 2 GiB"; fehler=1; }
          [ $fehler = 0 ]

          mib() { awk -v b="$1" 'BEGIN { printf "%.1f MiB", b / 1048576 }'; }
          {
            echo "Wegegraph für ganz DACH (Deutschland, Österreich, Schweiz), Format 2"
            echo "([Format](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/wegegraph-format.md)),"
            echo "aus dem Geofabrik-Auszug \`$DATEI\` (OSM-Daten vom $DATUM)."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Kacheln | $kacheln (Grenze 20.000 Dateien je Worker) |"
            echo "| Größe | $(mib "$summe"), gepackt $(mib "$archiv") (Grenze 2 GiB) |"
            echo "| Größte Kachel | \`$groesste_kachel\`, $(mib "$groesste") (Grenze 25 MiB) |"
            echo "| Bau | $dauer, höchstens $(mib $((speicher_kb * 1024))) Speicher |"
            echo
            echo "Daten © [OpenStreetMap-Mitwirkende](https://www.openstreetmap.org/copyright), Open Database License"
            echo "(ODbL) 1.0. Der Wegegraph ist eine abgeleitete Datenbank und steht ebenfalls unter der ODbL."
          } > notizen.md
          cat notizen.md >> "$GITHUB_STEP_SUMMARY"

      - name: Release
        if: steps.version.outputs.neu == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DATUM: ${{ steps.version.outputs.datum }}
        run: |
          gh release create "$VERSION" wegegraph.tar.gz wegegraph.json SHA256SUMS \
            --target "$GITHUB_SHA" --title "Wegegraph DACH $DATUM" --notes-file notizen.md
          gh release list --limit 100 --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[$BEHALTEN:] | .[].tagName" |
            while read -r alt; do gh release delete "$alt" --cleanup-tag --yes; done
